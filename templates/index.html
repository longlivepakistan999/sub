<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subfinder Web</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif;
           max-width: 960px; margin: 2em auto; padding: 0 1em; color: #222; }
    h1 { font-size: 1.4em; margin-bottom: 0.3em; }
    .hint { color: #666; font-size: 0.85em; margin-bottom: 1em; }
    form { display: flex; gap: 0.5em; margin-bottom: 1.2em; align-items: flex-start; }
    textarea { flex: 1; padding: 0.55em 0.7em; font-size: 1em; resize: vertical;
               border: 1px solid #bbb; border-radius: 4px; font-family: inherit; }
    button { padding: 0.55em 1.2em; font-size: 1em; cursor: pointer;
             background: #2563eb; color: #fff; border: 0; border-radius: 4px; }
    button:hover { background: #1d4ed8; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.5em 0.6em; border-bottom: 1px solid #eee;
             text-align: left; font-size: 0.92em; vertical-align: top; }
    th { background: #fafafa; }
    .status-queued  { color: #6b7280; }
    .status-running { color: #c2780b; }
    .status-done    { color: #047857; }
    .status-failed  { color: #b91c1c; }
    .err { font-size: 0.78em; color: #b91c1c; word-break: break-all; }
    a { color: #2563eb; }
    .summary { background: #f4f6fb; border: 1px solid #dde3f0;
               border-radius: 4px; padding: 0.7em 0.9em; margin-bottom: 1em;
               font-size: 0.92em; line-height: 1.5; }
    .summary .current { font-weight: 600; color: #c2780b; }
    .progress-bar { height: 6px; background: #e5e7eb; border-radius: 3px;
                    overflow: hidden; margin-top: 0.5em; }
    .progress-bar > span { display: block; height: 100%; background: #2563eb;
                           transition: width 0.3s ease; }
    .promote-btn { padding: 0.25em 0.6em; font-size: 0.8em;
                   background: #fff; color: #2563eb; border: 1px solid #2563eb;
                   border-radius: 3px; cursor: pointer; }
    .promote-btn:hover { background: #2563eb; color: #fff; }
    .pos { color: #6b7280; font-size: 0.78em; margin-left: 0.3em; }
    details.settings { background: #fafafa; border: 1px solid #e5e7eb;
                       border-radius: 4px; padding: 0.4em 0.7em; margin-bottom: 1em;
                       font-size: 0.9em; }
    details.settings > summary { cursor: pointer; font-weight: 600;
                                  list-style: none; }
    details.settings > summary::-webkit-details-marker { display: none; }
    .settings-row { display: flex; gap: 0.5em; margin-top: 0.6em; align-items: center; }
    .settings-row input { flex: 1; padding: 0.4em 0.6em; font-size: 0.9em;
                          font-family: ui-monospace, monospace;
                          border: 1px solid #bbb; border-radius: 4px; }
    .settings-row button { padding: 0.4em 0.9em; font-size: 0.9em; }
    .bin-status { margin-top: 0.4em; font-size: 0.85em; word-break: break-all; }
    .bin-status.ok  { color: #047857; }
    .bin-status.bad { color: #b91c1c; }
  </style>
</head>
<body>
  <h1>Subfinder Web</h1>
  <div class="hint">支持一次输入多个域名，用空格、逗号或换行分隔；按提交顺序排队扫描。</div>

  <details class="settings" id="settings">
    <summary>subfinder 路径设置</summary>
    <div class="settings-row">
      <input id="bin-input" type="text" placeholder="/usr/local/bin/subfinder 或 subfinder">
      <button id="bin-save" type="button">保存</button>
      <button id="bin-test" type="button">检测</button>
    </div>
    <div id="bin-status" class="bin-status"></div>
  </details>

  <form id="scan-form">
    <textarea id="domains" rows="4"
      placeholder="example.com&#10;foo.com, bar.com" required></textarea>
    <button type="submit">扫描</button>
  </form>

  <div id="summary" class="summary" style="display:none"></div>

  <table>
    <thead>
      <tr>
        <th>域名</th><th>状态</th><th>子域数</th>
        <th>创建时间</th><th>耗时</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="tasks"></tbody>
  </table>

<script>
const form = document.getElementById('scan-form');
const tbody = document.getElementById('tasks');
const summaryEl = document.getElementById('summary');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function fmtTime(ts) { return ts ? new Date(ts*1000).toLocaleTimeString() : '-'; }
function fmtDur(s, e) {
  if (!s) return '-';
  const end = e || Date.now()/1000;
  return (end - s).toFixed(1) + 's';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('domains');
  const domains = input.value.trim();
  if (!domains) return;
  const res = await fetch('/api/scan', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({domains}),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    alert(body.error || '提交失败');
    return;
  }
  input.value = '';
  if (body.rejected && body.rejected.length) {
    alert('已忽略无效域名:\n' + body.rejected.join('\n'));
  }
  refresh();
});

async function promoteTask(tid) {
  const res = await fetch(`/api/tasks/${encodeURIComponent(tid)}/promote`, {method:'POST'});
  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    alert(err.error || '提前失败');
  }
  refresh();
}
window.promoteTask = promoteTask;

function renderSummary(s) {
  if (!s || s.total === 0) { summaryEl.style.display = 'none'; return; }
  summaryEl.style.display = '';
  const pct = s.total ? Math.round(s.finished * 100 / s.total) : 0;
  const cur = s.current_domain
    ? `<span class="current">正在扫描: ${esc(s.current_domain)}</span>`
    : (s.queued ? '等待中…' : '空闲');
  summaryEl.innerHTML = `
    <div>总进度: ${s.finished} / ${s.total}
      （完成 ${s.done}，失败 ${s.failed}，排队 ${s.queued}） · ${cur}</div>
    <div class="progress-bar"><span style="width:${pct}%"></span></div>
  `;
}

async function refresh() {
  try {
    const res = await fetch('/api/tasks');
    const data = await res.json();
    renderSummary(data.summary);
    tbody.innerHTML = data.tasks.map(t => {
      const statusCell = t.status === 'queued' && t.position
        ? `${esc(t.status)}<span class="pos">#${t.position}</span>`
        : esc(t.status);
      let action = '';
      if (t.status === 'done') {
        action = `<a href="/api/tasks/${esc(t.id)}/download">下载</a>`;
      } else if (t.status === 'queued' && t.position && t.position > 1) {
        action = `<button class="promote-btn"
                          onclick="promoteTask('${esc(t.id)}')">提前</button>`;
      }
      return `
        <tr>
          <td>${esc(t.domain)}</td>
          <td class="status-${esc(t.status)}">
            ${statusCell}
            ${t.error ? `<div class="err">${esc(t.error)}</div>` : ''}
          </td>
          <td>${t.count}</td>
          <td>${fmtTime(t.created_at)}</td>
          <td>${fmtDur(t.started_at, t.finished_at)}</td>
          <td>${action}</td>
        </tr>`;
    }).join('');
  } catch (e) { /* ignore transient errors */ }
}

const binInput = document.getElementById('bin-input');
const binStatus = document.getElementById('bin-status');
const settingsBox = document.getElementById('settings');

function renderBinStatus(d) {
  if (!d) { binStatus.textContent = ''; binStatus.className = 'bin-status'; return; }
  if (d.ok) {
    binStatus.className = 'bin-status ok';
    binStatus.textContent = `✓ ${d.bin}  ${d.version || ''}`;
  } else {
    binStatus.className = 'bin-status bad';
    binStatus.textContent = `✗ ${d.bin || ''}  ${d.error || ''}`;
    settingsBox.open = true;
  }
}

async function loadBin() {
  try {
    const r = await fetch('/api/config');
    const d = await r.json();
    if (!binInput.value) binInput.value = d.saved_bin || d.bin || '';
    renderBinStatus(d);
  } catch (e) {}
}

async function saveBin() {
  const path = binInput.value.trim();
  if (!path) return;
  const r = await fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({subfinder_bin: path}),
  });
  const d = await r.json();
  renderBinStatus(d);
  if (r.ok) settingsBox.open = false;
}

async function testBin() {
  const path = binInput.value.trim();
  const url = path
    ? '/api/config?bin=' + encodeURIComponent(path)
    : '/api/config';
  const r = await fetch(url);
  renderBinStatus(await r.json());
}

document.getElementById('bin-save').addEventListener('click', saveBin);
document.getElementById('bin-test').addEventListener('click', testBin);

loadBin();
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
